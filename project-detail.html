<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Detail</title>
  <style>
    @font-face {
      font-family: "Wix Madefor Text";
      src: url("./fonts/WixMadeforText-Regular.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: "Wix Madefor Text";
      src: url("./fonts/WixMadeforText-Medium.ttf") format("truetype");
      font-style: normal;
      font-weight: 500;
      font-display: swap;
    }

    @font-face {
      font-family: "Wix Madefor Text";
      src: url("./fonts/WixMadeforText-SemiBold.ttf") format("truetype");
      font-style: normal;
      font-weight: 600;
      font-display: swap;
    }

    @font-face {
      font-family: "Wix Madefor Text";
      src: url("./fonts/WixMadeforText-Bold.ttf") format("truetype");
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }

    @font-face {
      font-family: "Wix Madefor Text";
      src: url("./fonts/WixMadeforText-ExtraBold.ttf") format("truetype");
      font-style: normal;
      font-weight: 800;
      font-display: swap;
    }

    :root {
      --bg: #F5F5F0;
      --fg: #000000;
      --muted: rgba(0, 0, 0, 0.72);
      --soft-muted: rgba(0, 0, 0, 0.38);
      --border: rgba(0, 0, 0, 0.12);
      --panel: rgba(255, 255, 255, 0.42);
      --font-display: "Bricolage Grotesque", sans-serif;
      --font-body: "Wix Madefor Text", sans-serif;
      --ease-out-expo: cubic-bezier(.16,1,.3,1);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .back-link {
      position: fixed;
      top: 1.8rem;
      left: 2rem;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 0.88rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding-bottom: 0.18rem;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .detail-page {
      width: 100%;
    }

    .detail-hero {
      height: 100vh;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 2fr;
      align-items: start;
      padding: 7rem 2rem 0;
      position: sticky;
      top: 0;
      z-index: 1;
      overflow: hidden;
    }

    .detail-copy-stack {
      grid-column: 1 / 3;
      width: 100%;
      margin-left: auto;
      position: sticky;
      top: 6rem;
      z-index: 3;
    }

    .detail-copy {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 4rem;
      align-items: start;
      width: 100%;
    }

    .detail-side-meta {
      grid-column: 1 / 2;
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
    }

    .detail-main-body {
      grid-column: 2 / 3;
      width: 100%;
    }

    /* Primary copy is relative by default, secondary is absolute */
    .detail-copy-stack .detail-copy-primary {
      position: relative;
      transition: color .45s ease, opacity .45s ease;
    }

    .detail-copy-stack .detail-copy-secondary {
      position: absolute;
      inset: 0;
      top: 0;
      pointer-events: none;
      transition: color .45s ease, opacity .45s ease;
    }

    /* Swap relative/absolute positions when exhibition copy is active */
    body.exhibition-copy-active .detail-copy-stack .detail-copy-primary {
      position: absolute;
      inset: 0;
      top: 0;
      pointer-events: none;
    }

    body.exhibition-copy-active .detail-copy-stack .detail-copy-secondary {
      position: relative;
      pointer-events: auto;
    }

    .detail-copy-secondary {
      opacity: 0;
    }

    .detail-copy-secondary[hidden] {
      display: none !important;
    }

    body.exhibition-copy-active .detail-copy-primary {
      opacity: 0;
      pointer-events: none;
    }

    body.exhibition-copy-active .detail-copy-secondary {
      opacity: 1;
      pointer-events: auto;
      color: #000;
    }

    body.exhibition-copy-active .detail-copy-secondary,
    body.exhibition-copy-active .detail-copy-secondary .meta-value,
    body.exhibition-copy-active .detail-copy-secondary .abstract {
      color: #000;
    }

    body.exhibition-copy-dimmed .detail-copy-secondary,
    body.exhibition-copy-dimmed .detail-copy-secondary .meta-value,
    body.exhibition-copy-dimmed .detail-copy-secondary .abstract {
      color: var(--soft-muted);
    }

    body.scrolled-copy .detail-copy-primary,
    body.scrolled-copy .detail-copy-primary .meta-value,
    body.scrolled-copy .detail-copy-primary .abstract {
      color: var(--soft-muted);
    }

    .eyebrow {
      margin: 0 0 1rem;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .detail-title {
      margin: 0 0 1.4rem;
      font-family: var(--font-display);
      font-size: clamp(2.6rem, 7vw, 7rem);
      line-height: 0.92;
      max-width: 12ch;
    }

    .abstract {
      margin: 0;
      max-width: calc(100vw - 4rem);
      font-size: clamp(1.05rem, 1.8vw, 1.28rem);
      line-height: 1.85;
      color: var(--muted);
      transition: color .45s ease;
    }

    .detail-featured {
      margin-bottom: 1.2rem;
      padding: 0.7rem 1rem;
      border-left: 2px solid currentColor;
      font-size: 11px;
      letter-spacing: 0.06em;
      opacity: 0.75;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .detail-featured a {
      text-decoration: underline;
    }

    .abstract p {
      margin: 0;
    }

    .abstract p + p {
      margin-top: 1.5rem;
    }

    .detail-meta {
      margin-top: 2.8rem;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.8rem 2rem;
      max-width: 42rem;
    }

    .meta-block {
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .meta-label {
      margin: 0 0 0.8rem;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .meta-value {
      margin: 0;
      color: var(--fg);
      line-height: 1.8;
      transition: color .45s ease;
    }

    .detail-gallery {
      position: relative;
      z-index: 2;
      margin-top: -100vh;
      padding: 100vh 0 5rem;
    }

    .gallery-list {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .gallery-item {
      width: 100%;
    }

    .gallery-transition-marker {
      width: 100%;
      height: 1px;
    }

    .gallery-transition-marker.chapter-break {
      height: 100vh;
    }

    .gallery-item.primary {
      width: 100vw;
      margin-left: calc(50% - 50vw);
      margin-right: calc(50% - 50vw);
    }

    .gallery-frame {
      position: relative;
      overflow: hidden;
      background: var(--panel);
      border-radius: 0;
      min-height: 72vh;
      display: grid;
      place-items: end start;
      isolation: isolate;
      opacity: 1;
      transition: opacity 0.35s ease, transform 0.35s var(--ease-out-expo);
    }

    .gallery-item:not(.primary) .gallery-frame {
      width: min(1400px, calc(100vw - 4rem));
      aspect-ratio: 16 / 10;
      min-height: auto;
      margin: 0 auto;
      border-radius: 8px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.14);
    }

    .gallery-visual {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transform: scale(1.01);
    }

    .gallery-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .gallery-vimeo {
      border: 0;
      object-fit: unset;
    }

    .video-controls {
      position: absolute;
      left: 1.35rem;
      right: 1.35rem;
      top: 1.35rem;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.75rem 0.9rem;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.64);
      backdrop-filter: blur(12px);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .25s ease, transform .25s ease;
      pointer-events: none;
    }

    .gallery-frame:hover .video-controls,
    .gallery-frame:focus-within .video-controls {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    @media (hover: none), (pointer: coarse) {
      .video-controls {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
    }

    .video-btn,
    .video-range {
      appearance: none;
      -webkit-appearance: none;
    }

    .video-btn {
      border: 0;
      background: rgba(234, 234, 234, 0.88);
      color: #000;
      border-radius: 999px;
      padding: 0.45rem 0.8rem;
      font: 500 0.82rem/1 var(--font-body);
      cursor: pointer;
      transition: background .2s ease;
    }

    .video-btn:hover,
    .video-btn:focus-visible {
      background: rgba(234, 234, 234, 0.96);
      outline: none;
    }

    .video-range {
      appearance: auto;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.42);
      accent-color: #fff;
      cursor: pointer;
    }

    .video-range.timeline {
      flex: 1;
      min-width: 6rem;
    }

    .video-range.volume {
      width: 6rem;
    }

    .video-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      border: 0;
    }

    .video-range::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      border: 0;
    }

    .video-range::-moz-range-track {
      height: 4px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.22);
    }

    .detail-footer-actions {
      position: fixed;
      left: 2rem;
      right: 2rem;
      bottom: 2rem;
      z-index: 30;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .footer-action {
      pointer-events: auto;
      background: none;
      border: none;
      padding: 0;
      font: 400 11px/1 var(--font-body);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      transition: color .2s ease, transform .25s ease;
    }

    .footer-action:hover,
    .footer-action:focus-visible {
      color: var(--fg);
      transform: scale(1.14);
      outline: none;
    }

    #detailBackTop {
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px) scale(1);
      transition: opacity .35s ease, transform .35s ease, color .2s;
    }

    #detailBackTop.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    #detailBackTop.visible:hover,
    #detailBackTop.visible:focus-visible {
      transform: translateY(0) scale(1.14);
    }

    #nextProjectLink {
      font-size: 24px;
      line-height: 1;
      letter-spacing: 0.05em;
      text-transform: none;
      font-family: var(--font-body);
      font-weight: 400;
      color: var(--muted);
      text-decoration: none;
      display: inline-block;
      position: relative;
      transform-origin: center;
      transition:
        color .25s ease,
        opacity .25s ease,
        transform .35s var(--ease-out-expo),
        text-shadow .35s ease;
    }

    #nextProjectLink::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -0.22em;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform .35s var(--ease-out-expo);
    }

    #nextProjectLink:hover,
    #nextProjectLink:focus-visible {
      color: var(--fg);
      opacity: 1;
      transform: translateY(-2px);
      text-shadow: 0 0 18px rgba(0, 0, 0, 0.08);
      outline: none;
    }

    #nextProjectLink:hover::after,
    #nextProjectLink:focus-visible::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    @media (max-width: 960px) {
      .detail-hero {
        grid-template-columns: 1fr;
        padding: 6rem 1.5rem 0;
        position: sticky;
        top: 0;
        z-index: 1;
      }

      .detail-copy-stack {
        grid-column: 1;
        width: 100%;
        position: sticky;
        top: 5rem;
        z-index: 3;
      }

      .detail-copy {
        display: flex;
        flex-direction: column;
        gap: 2.5rem;
        width: 100%;
      }

      .detail-main-body {
        order: 1;
        width: 100%;
      }

      .detail-side-meta {
        order: 2;
        width: 100%;
        gap: 1.5rem;
      }

      .detail-copy-secondary {
        opacity: 0;
      }

      .detail-copy-secondary .abstract,
      .detail-copy-secondary .meta-value {
        color: var(--muted);
      }

      body.scrolled-copy .detail-copy,
      body.scrolled-copy .detail-copy .meta-value,
      body.scrolled-copy .detail-copy .abstract {
        color: inherit;
      }

      .detail-meta {
        grid-template-columns: 1fr;
      }

      .gallery-item.primary .gallery-frame {
        min-height: 52vh;
      }

      .detail-gallery {
        margin-top: -100vh;
        padding-top: 100vh;
      }

      .gallery-transition-marker.chapter-break {
        height: 60vh;
      }

      .gallery-item:not(.primary) .gallery-frame {
        width: min(100%, calc(100vw - 3rem));
      }

      .video-controls {
        left: 1rem;
        right: 1rem;
        top: 1rem;
        gap: 0.7rem;
        padding: 0.7rem 0.8rem;
      }

      .video-range.volume {
        width: 4.5rem;
      }

      .back-link {
        left: 1.5rem;
      }

      .detail-footer-actions {
        left: 1.5rem;
        right: 1.5rem;
        bottom: 1.5rem;
      }

      #nextProjectLink {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <a class="back-link" id="backToWorkLink" href="./index.html">Home</a>

  <main class="detail-page">
    <section class="detail-hero">
      <div class="detail-copy-stack">
        <div class="detail-copy detail-copy-primary">
          <div class="detail-side-meta">
            <section class="meta-block">
              <p class="meta-label">Project Type</p>
              <p class="meta-value" id="detailServices"></p>
            </section>
            <section class="meta-block">
              <p class="meta-label">System Architecture</p>
              <p class="meta-value" id="detailSystemArchitecture"></p>
            </section>
            <section class="meta-block">
              <p class="meta-label">Credits</p>
              <p class="meta-value" id="detailCredits"></p>
            </section>
          </div>

          <div class="detail-main-body">
            <p class="eyebrow" id="detailEyebrow">Project detail</p>
            <h1 class="detail-title" id="detailTitle">Project</h1>
            <div id="detailFeatured" class="detail-featured" hidden></div>
            <div class="abstract" id="detailAbstract"></div>

            <div class="detail-meta" id="detailProcessMeta" style="margin-top: 2.8rem;" hidden>
              <section class="meta-block" id="detailChallengeBlock">
                <p class="meta-label">Challenge</p>
                <p class="meta-value" id="detailChallenge"></p>
              </section>
              <section class="meta-block" id="detailApproachBlock">
                <p class="meta-label">Approach</p>
                <p class="meta-value" id="detailApproach"></p>
              </section>
              <section class="meta-block" id="detailRoleBlock">
                <p class="meta-label">My Role</p>
                <p class="meta-value" id="detailRole"></p>
              </section>
            </div>
          </div>
        </div>

        <div class="detail-copy detail-copy-secondary" id="detailExhibitionCopy" hidden>
          <div class="detail-side-meta">
            <section class="meta-block">
              <p class="meta-label">Credits</p>
              <p class="meta-value" id="detailExhibitionCredits"></p>
            </section>
          </div>

          <div class="detail-main-body">
            <p class="eyebrow" id="detailExhibitionEyebrow">Exhibition</p>
            <h1 class="detail-title" id="detailExhibitionTitle">Exhibition</h1>
            <div class="abstract" id="detailExhibitionAbstract"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="detail-gallery">
      <div class="gallery-list" id="galleryList"></div>
    </section>
  </main>

  <div class="detail-footer-actions">
    <button class="footer-action" id="detailBackTop" type="button">Nowhere to go but up ↑↑</button>
    <a class="footer-action" id="nextProjectLink" href="./index.html#work">Next project</a>
  </div>

  <script>
    const PROJECTS = {
      "human-loci": {
        title: "Human Loci",
        eyebrow: "Tangible experience of place",
        abstract: `<p>A listening object that transforms places into tactile and auditory experiences. Each disk encodes a specific location through recorded soundscapes and a distinct material identity. Place a disk on the player and the environment comes to life through touch, sound, and form.</p>`,
        challenge: "We didn't know how plexiglass would behave structurally or aesthetically until we started cutting it. Finding the right thickness and slot dimensions to achieve clean curves without cracking took many iterations. The tonearm was the trickiest part: it needed to trigger a small on/off switch with enough precision that any slight misalignment would break the interaction. I modelled and 3D printed several versions, each one refining the tolerances a little more, until it worked consistently.",
        approach: "We kept testing and iterating on every component in parallel rather than waiting for one to be perfect before moving to the next. Each version of a part taught us something specific about what had to change, which made the process faster and more grounded than trying to solve things on paper first.",
        role: "Concept development and project storytelling · Tonearm mechanism design and 3D prototyping · Object aesthetics and formal decisions · Presentation structure and project documentation",
        services: ["#TangibleInteraction", "#EmbodiedInteraction", "#ConceptualDesign", "#DesignResearch"],
        systemArchitecture: ["#PhysicalComputing", "#EmbededSystems", "#RFID", "#Microcontroller"],
        credits: ["Jérémy Martin", "Nicholas Vos"],
        theme: {
          bg: "#F3EDE8",
          fg: "#18180F",
          muted: "rgba(24,24,15,0.68)",
          soft: "rgba(24,24,15,0.34)",
          border: "rgba(24,24,15,0.12)",
          panel: "rgba(255,255,255,0.4)"
        },
        images: [
          { label: "Product", bg: 'center / cover no-repeat url("assets/projects/human loci/jpeg/humanloci-main.jpg")' },
          { label: "General view 1", bg: 'center / cover no-repeat url("assets/projects/human loci/jpeg/humanloci-generalview1.jpg")' },
          { label: "General view 2", bg: 'center / cover no-repeat url("assets/projects/human loci/jpeg/humanloci-generalview2.jpg")' },
          { label: "General view 3", bg: 'center / cover no-repeat url("assets/projects/human loci/jpeg/humanloci-generalview3.jpg")' },
          { label: "Detail", bg: 'center / cover no-repeat url("assets/projects/human loci/jpeg/humanloci-detail1.jpg")' },
          { label: "Interaction 1", bg: 'center / cover no-repeat url("assets/projects/human loci/jpeg/humanloci-interaction1.jpg")' },
          { label: "Interaction 2", bg: 'center / cover no-repeat url("assets/projects/human loci/jpeg/humanloci-interaction2.jpg")' }
        ]
      },
      "meeting-pond": {
        title: "Meeting Pond",
        eyebrow: "Connected presence system",
        abstract: `<p>A pair of connected light objects that let two distant people feel each other's presence without words or screens. Each device sits in a calm idle state showing a minimal surface of light. When one person taps, a ripple travels across distance and arrives in real time on the other device, turning a small physical gesture into a shared moment.</p>`,
        challenge: "Working with an LED matrix gives you very few pixels, which makes it genuinely hard to create visuals that feel both meaningful and beautiful. The constraint pushes you toward abstraction immediately, and it is easy to end up with something that looks technically functional but emotionally empty.",
        approach: "We decided to lead with concept rather than visuals. Once we had a strong emotional idea around the feeling of distant presence, the right visual followed naturally. Water was an obvious and poetic fit: it moves, it responds to touch, and it conveys connection without needing to represent anything literally. The constraint became an advantage.",
        role: "Concept and emotional framing · Water ripple visual design on the LED matrix · Project communication and documentation",
        services: ["#HumanComputerInteraction", "#PhysicalComputing", "#ExperienceDesign"],
        systemArchitecture: ["#LEDMatrix", "#GestureRecognition", "#RealTimeSystem", "#IoT"],
        credits: ["Jérémy Martin"],
        theme: {
          bg: "#EEF6F2",
          fg: "#121915",
          muted: "rgba(18,25,21,0.68)",
          soft: "rgba(18,25,21,0.34)",
          border: "rgba(18,25,21,0.12)",
          panel: "rgba(255,255,255,0.48)"
        },
        images: [
          { label: "System overview", type: "vimeo", src: "1182421737" },
          { label: "Interaction 1", bg: 'center / cover no-repeat url("assets/projects/meeting pond/jpeg/meetingpond-interaction1.jpg")' },
          { label: "General view 2", bg: 'center / cover no-repeat url("assets/projects/meeting pond/jpeg/meetingpond-general2.jpg")' },
          { label: "General view 3", bg: 'center / cover no-repeat url("assets/projects/meeting pond/jpeg/meetingpond-general3.jpg")' },
          { label: "General view 4", bg: 'center / cover no-repeat url("assets/projects/meeting pond/jpeg/meetingpond-general4.jpg")' },
          { label: "Components", bg: 'center / cover no-repeat url("assets/projects/meeting pond/jpeg/meetingpond-components.jpg")' }
        ]
      },
      "financial-planning-hub": {
        title: "Financial Planning Hub",
        eyebrow: "Service platform",
        abstract: `<p>This UX/UI project investigates how financial planning can be redesigned as an intuitive and evolving experience. Combining user research, interaction design, and visual storytelling, it proposes a system that integrates planning tools, scenario simulations, and contextual guidance. A dynamic visual metaphor reflects the user's financial evolution over time, making abstract data more understandable and engaging.</p>`,
        services: ["#UX", "#UI", "#DesignInterface"],
        systemArchitecture: ["#Figma", "#DigitalPrototyping"],
        credits: ["Walter de Nicola", "Roberta Valli", "Riccardo Assirelli", "Isabel Parini"],
        theme: {
          bg: "#F2F0FA",
          fg: "#161420",
          muted: "rgba(22,20,32,0.68)",

          panel: "rgba(255,255,255,0.46)"

        images: [

      if (image.type === "video" || image.type === "vimeo") {
        const controls = document.createElement("div");

        const playButton = document.createElement("button");
        playButton.className = "video-btn";
        playButton.type = "button";
        playButton.textContent = "Pause";

        const timeline = document.createElement("input");
        timeline.className = "video-range timeline";
        timeline.type = "range";
        timeline.min = "0";
        timeline.max = "100";
        timeline.step = "0.1";
        timeline.value = "0";

        const volume = document.createElement("input");
        volume.className = "video-range volume";
        volume.type = "range";
        volume.min = "0";
        volume.max = "1";
        volume.step = "0.01";
        volume.value = "0";

        if (image.type === "vimeo") {
          let isPaused = false;
          let duration = 0;
          let isSeeking = false;
          const sendToVimeo = payload => {
            visual.contentWindow?.postMessage(payload, "https://player.vimeo.com");
          };

          const handleVimeoMessage = event => {
            if (event.origin !== "https://player.vimeo.com") return;
            if (event.source !== visual.contentWindow) return;

            let payload = event.data;
            if (typeof payload === "string") {
              try {
                payload = JSON.parse(payload);
              } catch {
                return;
              }
            }

            if (!payload) return;

            if (payload.event === "play") {
              isPaused = false;
              playButton.textContent = "Pause";
            }

            if (payload.event === "pause") {
              isPaused = true;
              playButton.textContent = "Play";
            }

            if (payload.event === "timeupdate" && payload.data && !isSeeking) {
              duration = payload.data.duration || duration;
              if (payload.data.percent != null) {
                timeline.value = payload.data.percent * 100;
              } else if (duration > 0 && payload.data.seconds != null) {
                timeline.value = (payload.data.seconds / duration) * 100;
              }
            }

            if (payload.event === "loaded" && payload.data && payload.data.duration) {
              duration = payload.data.duration;
            }
          };

          window.addEventListener("message", handleVimeoMessage);

          visual.addEventListener("load", () => {
            sendToVimeo({ method: "addEventListener", value: "play" });
            sendToVimeo({ method: "addEventListener", value: "pause" });
            sendToVimeo({ method: "addEventListener", value: "timeupdate" });
            sendToVimeo({ method: "addEventListener", value: "loaded" });
            sendToVimeo({ method: "setVolume", value: 0 });
            sendToVimeo({ method: "play" });
          });

          playButton.addEventListener("click", () => {
            isPaused = !isPaused;
            playButton.textContent = isPaused ? "Play" : "Pause";
            sendToVimeo({ method: isPaused ? "pause" : "play" });
          });

          volume.addEventListener("input", () => {
            const level = Number(volume.value);
            sendToVimeo({ method: "setMuted", value: level === 0 });
            sendToVimeo({ method: "setVolume", value: level });
          });

          timeline.addEventListener("input", () => {
            if (!duration) return;
            isSeeking = true;
            sendToVimeo({ method: "setCurrentTime", value: (Number(timeline.value) / 100) * duration });
          });

          timeline.addEventListener("change", () => {
            isSeeking = false;
          });
        } else {
          const syncTimeline = () => {
            if (!visual.duration) return;
            timeline.value = (visual.currentTime / visual.duration) * 100;
          };

          const syncPlayState = () => {
            playButton.textContent = visual.paused ? "Play" : "Pause";
          };

          playButton.addEventListener("click", () => {
            if (visual.paused) {
              visual.play();
            } else {
              visual.pause();
            }
          });

          timeline.addEventListener("input", () => {
            if (!visual.duration) return;
            visual.currentTime = (Number(timeline.value) / 100) * visual.duration;
          });

          volume.addEventListener("input", () => {
            visual.muted = false;
            visual.volume = Number(volume.value);
          });

          visual.addEventListener("timeupdate", syncTimeline);
          visual.addEventListener("play", syncPlayState);
          visual.addEventListener("pause", syncPlayState);
          visual.addEventListener("loadedmetadata", syncTimeline);
        }

        controls.appendChild(playButton);
        controls.appendChild(timeline);
        controls.appendChild(volume);
        frame.appendChild(controls);
      }

      const pauseRoom = isMobile ? 100 : 200; // Extra breathing room before images slide up

        primaryCopy.style.transform = "none";
        const h = primaryCopy.getBoundingClientRect().height;
        primaryCopy.style.transform = prevTransform;
        
        overflowPrimary = Math.max(0, h - maxVisibleHeight);
      } else {
        overflowPrimary = 0;
      }

      // 2. Calculate Exhibition Copy Overflow
      const exhibitionCopy = document.querySelector(".detail-copy-secondary");
      if (project.exhibition && exhibitionCopy) {
        const prevStyle = exhibitionCopy.style.cssText;
        exhibitionCopy.style.position = "relative";
        exhibitionCopy.style.display = "block";
        exhibitionCopy.style.opacity = "0";
        exhibitionCopy.style.transform = "none";
        
        const h = exhibitionCopy.getBoundingClientRect().height;
        
        exhibitionCopy.style.cssText = prevStyle;
        overflowExhibition = Math.max(0, h - maxVisibleHeight);
      } else {
        overflowExhibition = 0;
      }

      // 3. Update Gallery Padding and Margin to account for primary overflow + pause room
      const galleryElement = document.querySelector(".detail-gallery");
      if (galleryElement) {
        galleryElement.style.marginTop = "-100vh";
        galleryElement.style.paddingTop = `calc(100vh + ${overflowPrimary}px + ${pauseRoom}px)`;

      // 4. Update Exhibition Marker height to account for exhibition overflow + pause room
      if (exhibitionMarker) {
        const baseHeight = isMobile ? 60 : 100;
        exhibitionMarker.style.height = `calc(${baseHeight}vh + ${overflowExhibition}px + ${pauseRoom}px)`;

    };

    const handleScrollAndTranslation = () => {

      const primaryCopy = document.querySelector(".detail-copy-primary");
      const exhibitionCopy = document.querySelector(".detail-copy-secondary");

      const isExhibitionActive = document.body.classList.contains("exhibition-copy-active");
      
      if (!isExhibitionActive) {
        if (primaryCopy) {
          const transY = -Math.min(y, overflowPrimary);
          primaryCopy.style.transform = `translateY(${transY}px)`;
        }
        if (exhibitionCopy) {
          exhibitionCopy.style.transform = "translateY(0px)";
        }
      } else {
        if (primaryCopy) {
          primaryCopy.style.transform = "translateY(0px)";
        }
        
        if (exhibitionCopy && exhibitionMarker) {
          const viewportMidpoint = window.innerHeight / 2;
          const triggerY = exhibitionMarker.offsetTop - viewportMidpoint;
          const relativeScroll = y - triggerY;
          
          if (relativeScroll > 0) {
            const transY = -Math.min(relativeScroll, overflowExhibition);
            exhibitionCopy.style.transform = `translateY(${transY}px)`;

        const exhibitionActive = markerRect.top <= viewportMidpoint;
        document.body.classList.toggle("exhibition-copy-active", exhibitionActive);

        if (exhibitionActive && exhibitionFirstItem) {
          const exhibitionFirstRect = exhibitionFirstItem.getBoundingClientRect();
          document.body.classList.toggle("exhibition-copy-dimmed", exhibitionFirstRect.top <= viewportMidpoint);
        } else {
          document.body.classList.remove("exhibition-copy-dimmed");
        }
      } else {
        document.body.classList.remove("exhibition-copy-active");
        document.body.classList.remove("exhibition-copy-dimmed");
      }
    };

    recalculateLayout();
    handleScroll();
    handleScrollAndTranslation();

    window.addEventListener("scroll", () => {
      handleScroll();
      handleScrollAndTranslation();
    }, { passive: true });

    window.addEventListener("resize", () => {
      recalculateLayout();
      handleScroll();
      handleScrollAndTranslation();
    });
  </script>
</body>
</html>
